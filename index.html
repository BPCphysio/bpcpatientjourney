  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

own accents;\n     this yellow completes them, muted to the same press-ink register. A\n     print treatment color, not an interface accent — body copy and chrome\n     never take it. */\n  --color-process-yellow: #edbb00;\n\n  --font-heading: Rubik, \"Noto Sans Thai\", system-ui, sans-serif;\n  --font-heading-weight: 500;\n  --font-body: Rubik, \"Noto Sans Thai\", system-ui, sans-serif;\n\n  --space-1: 5.0px;\n  --space-2: 10.0px;\n  --space-3: 15.0px;\n  --space-4: 20.0px;\n  --space-6: 30.0px;\n  --space-8: 40.0px;\n\n  --radius-sm: 8px;\n  --radius-md: 8px;\n  --radius-lg: 14px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 3px rgba(31,36,76,.08);\n  --shadow-md: 0 6px 20px rgba(31,36,76,.10);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.halftone{position:relative;filter:grayscale(0.35) contrast(1.15);overflow:hidden}\n.halftone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The four-color separation treatment (review round 3) — a photograph\n   printed as its misregistered process plates, after the Catalogue Three\n   grammar. Markup: a figure.cmyk holding five copies of the image — the\n   first is the layout sizer (hidden), then one per plate, each tagged\n   .sep-c/.sep-m/.sep-y/.sep-k. The plates are extracted live by the SVG\n   feColorMatrix filters in print-plates.js, the system's own defs —\n   inlined in the compiled bundle every template page loads, and a\n   page that links styles.css directly adds\n   <script src=\"print-plates.js\"><\/script> itself (the defs must be in\n   the document: a data-URI filter reference would not survive Chromium,\n   and external-file references are unreliable across engines) — nudged\n   a few pixels out of register, and multiplied\n   onto the paper ground; the halftone dot screens the recombined print.\n   The plate offsets live with the deck's projection-scale CSS, since\n   misregistration is sized to the output. */\n.cmyk{position:relative;overflow:hidden;background:var(--color-bg)}\n.cmyk img:first-child{opacity:0} /* layout sizer AND the alt-bearing image — opacity\n  keeps it in the accessibility tree (visibility:hidden would drop the figure's only\n  description); fully transparent, it adds nothing to the multiply backdrop */\n.cmyk img+img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}\n.cmyk .sep-c{filter:url(#sep-c)}\n.cmyk .sep-m{filter:url(#sep-m)}\n.cmyk .sep-y{filter:url(#sep-y)}\n.cmyk .sep-k{filter:url(#sep-k)}\n.cmyk::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The one-image separation (review round 9, promoted from the deck in the\n   landing divergence) — the same four plates as ONE compound filter,\n   #sep-all in print-plates.js, for a single swappable image: a .print\n   wrapper inside the figure holds one <image-slot>, and the filter\n   extracts, offsets and multiplies the plates live from whatever the slot\n   shows. Markup: figure.cmyk > .print > image-slot (the page sizes the\n   .print — aspect-ratio, or absolute fill for bleeds). Hover resolves\n   the print into the photograph — the pressman checking registration on\n   the light table — so the source shows crisp and any swap chrome stays\n   legible; only the reduced-motion fallback below still lifts as a\n   single cut (a url() filter cannot CSS-transition; the press driver\n   animates the defs instead). */\n.cmyk .print{position:relative;width:100%;filter:url(#sep-all)}\n/* no hover end-state swap: the press driver (print-plates.js) eases the\n   plates into register while purifying their inks to the pure-process\n   separation on the same curve, so the converged four-plate merge IS\n   the photograph (their multiply equals SourceGraphic by construction)\n   — no cut anywhere on the animated path */\n@media (prefers-reduced-motion: reduce), (hover: none), (pointer: coarse) {\n  .cmyk .print:hover{filter:none} /* without the driver (it stands down on\n    exactly these conditions), hover stays the old single cut to the\n    crisp source */\n}\n.cmyk .print image-slot{width:100%;height:100%;display:block}\n\n/* The plate numeral (review rounds 3-4) — display figures set as\n   misregistered process plates, the catalog's cover grammar. Review\n   round 4 (Barron): THREE plates — C, M, Y only, no black plate — so the\n   dark core comes entirely from the C×M×Y multiply overlap (the inks\n   product to exact black), with the fringes the registration drift; and\n   the spread pulled in by half (less jumbled: one figure with plate\n   fringes rather than figures sliding apart). Markup: a .cmyk-num holding\n   a .paper span (the white of the sheet: the glyph's union, built from\n   offset text-shadow copies) and three .plate spans. The construction\n   carries its own ground (--cmyk-num-ground, defaulting to paper) painted\n   on its padding box, so the multiply plates always have their backdrop\n   even inside an isolated stacking context (entrance animations); the\n   padding bleeds wider than any plate offset and the negative margin\n   hands the layout box back. Offsets are em-scaled to the glyph. The\n   .paper span carries the text once for assistive tech; the .plate spans\n   are aria-hidden repeats. */\n.cmyk-num{--cmyk-num-ground:var(--color-bg);\n  position:relative;width:fit-content;line-height:0.9;\n  font-feature-settings:\"pnum\" 1;\n  background:var(--cmyk-num-ground);padding:0.12em;margin:-0.12em}\n.cmyk-num .paper{color:var(--color-bg); /* the white of the sheet — always paper,\n  whatever the ground: the plates read as printed on paper even when the\n  surrounding page is ink */\n  text-shadow:0.036em 0.025em 0 var(--color-bg),-0.031em -0.023em 0 var(--color-bg)}\n.cmyk-num .plate{position:absolute;inset:0.12em;mix-blend-mode:multiply;\n  text-box:trim-both cap alphabetic /* the host trims to its cap box; each\n  absolute plate must trim its own line the same way, or its glyphs sit a\n  half-leading below the paper union */}\n.cmyk-num .plate-c{color:var(--color-accent)}\n\n/* The plate headline (divergence round 3, Barron: \"use both\" — the\n   photograph's plates AND the cover grammar's text plates, on the same\n   page). The same three-plate construction as .cmyk-num — paper span\n   carrying the real text, C/M/Y plate repeats, dark core from the\n   multiply overlap — at HALF the numeral's round-4 offsets: the serif's\n   display hairlines are thinner than the numeral strokes the spread was\n   measured on, and the full offsets swallow them whole (probed at the\n   hero's 80px — the fringes read as an anaglyph poster, not a breath\n   out of register) — recut for display\n   headlines that sit in running text blocks on the page's own paper:\n   no ground painting and no padding bleed (the numeral's ground exists\n   for isolated stacking contexts; a headline on the page multiplies\n   straight onto the sheet), no width:fit-content and no line-height\n   override (the host display class owns its metrics — apply this to\n   each .line, which is position:relative for its plates), and the\n   plates are inert to the hand (pointer-events/user-select none, so a\n   triple-click selects the headline once, not four times). Plates take\n   the same pointer lean as .cmyk-num. */\n.cmyk-head{position:relative}\n.cmyk-head .paper{color:var(--color-bg);\n  text-shadow:0.027em 0.0185em 0 var(--color-bg),-0.0245em -0.0175em 0 var(--color-bg)\n  /* the union's copies sit at the construction's halved plate offsets\n     PLUS the full lean (0.018+0.009 / 0.0125+0.006, and mirrored), so\n     the union still backs the plates at viewport-edge lean — invisible\n     on the page's own paper, load-bearing on any other ground */}\n.cmyk-head .plate{position:absolute;inset:0;mix-blend-mode:multiply;\n  pointer-events:none;user-select:none;\n  text-box:trim-both cap alphabetic /* match the host's trim, or the\n  plates sit a half-leading below the paper union */}\n.cmyk-head .plate-c{color:var(--color-accent)}\n.cmyk-head .plate-m{color:var(--color-accent-2);\n  translate:calc(0.018em + 0.009em*var(--press-nx, 0)) calc(0.0125em + 0.006em*var(--press-ny, 0))}\n.cmyk-head .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.0155em + 0.009em*var(--press-nx, 0)) calc(-0.0115em + 0.006em*var(--press-ny, 0))}\n.cmyk-num .plate-m{color:var(--color-accent-2);\n  translate:calc(0.036em + 0.018em*var(--press-nx, 0)) calc(0.025em + 0.0125em*var(--press-ny, 0))}\n.cmyk-num .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.031em + 0.018em*var(--press-nx, 0)) calc(-0.023em + 0.0125em*var(--press-ny, 0))}\n/* --press-nx/--press-ny: the pointer lean as a bare -1..1 factor,\n   published on :root by the press driver (print-plates.js) and zero\n   whenever the driver stands down. Each construction scales the lean to\n   its own spread (half of it, here as everywhere) so the moving plates\n   drift a breath toward the cursor and the C plate holds. */\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input::placeholder { color: color-mix(in srgb, var(--color-text) 65%, transparent); opacity: 1; }\n  /* explicit, measured: the browser default gray misses the 4.5:1 small-text bar on\n     the surface fill; 65% ink measures 4.8:1 there, still a step quieter than typed\n     text (opacity:1 overrides Firefox's default placeholder fade) */\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); <\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;endpoint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://script.google.com/macros/s/AKfycby_T7t0CboCz5iMvfRa7oykcGl_xOcglRxWnT1iTVjc3WLONXefgV7WzY5Powcyozs/exec&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Hosting&quot;},&quot;staffPasscode&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Hosting&quot;},&quot;showModelAnswers&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Marking view&quot;}}\">\nconst ENDPOINT = 'https://script.google.com/macros/s/AKfycby_T7t0CboCz5iMvfRa7oykcGl_xOcglRxWnT1iTVjc3WLONXefgV7WzY5Powcyozs/exec';\nconst STAFF_PASSCODE = ''; // checked by the clinic script, never published in the page\nconst LS_LOCAL = 'bpc_pj_local_responses';\nconst LS_ADMIN = 'bpc_pj_admin_key';\nconst LS_TAKER = 'bpc_pj_taker';\nconst LS_DONE = 'bpc_pj_done_cases';\nconst LS_LANG = 'bpc_pj_lang';\nconst LS_SESSION = 'bpc_pj_session';\nconst LS_NAMES = 'bpc_pj_known_names';\nconst LS_OUTBOX = 'bpc_pj_outbox';\nconst LS_ROSTER = 'bpc_pj_roster';\nconst LS_MARKERS = 'bpc_pj_markers';\n// Until the clinic sheet's Markers tab has been read once on this device.\n// A copy of that tab as of 26/09/2026; the tab is the one to edit.\nconst DEFAULT_MARKERS = [\n  ['Sathorn', 'Gale'], ['Sathorn', 'Kun'], ['Sathorn', \"P'Ploy\"], ['Sathorn', 'Phing'], ['Sathorn', 'PloyR'], ['Sathorn', 'Tee'],\n  ['Sukhumvit', 'Gift'], ['Sukhumvit', 'Kwang'], ['Sukhumvit', 'Moothong'], ['Sukhumvit', 'Ninew'], ['Sukhumvit', 'Pik'], ['Sukhumvit', 'Tee'],\n  ['Sanam Pao', 'Tee'], ['Sanam Pao', 'Blue'], ['Sanam Pao', 'Nut'],\n  ['All branches', 'Nimit']\n].map(x => ({ branch: x[0], name: x[1] }));\n\nconst LS_MARKER = 'bpc_pj_marker';\n\n// Every date on the page: day/month/year, 24-hour, Bangkok time, whatever the\n// device is set to. (A device set to US English used to show month/day/year.)\nconst BKK = (() => {\n  try {\n    return new Intl.DateTimeFormat('en-GB', { timeZone: 'Asia/Bangkok', day: '2-digit', month: '2-digit',\n      year: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });\n  } catch (e) { return null; }\n})();\nfunction fmtWhen(ts) {\n  if (!ts) return '';\n  const d = new Date(ts);\n  if (BKK) return BKK.format(d).replace(',', '');\n  const p = n => String(n).padStart(2, '0');\n  return p(d.getDate()) + '/' + p(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());\n}\nfunction fmtDay(ts) { return fmtWhen(ts).split(' ')[0]; }\n\nconst newAttemptId = () => 'r' + Date.now() + Math.random().toString(36).slice(2, 6);\n\nfunction readOutbox() {\n  try { return JSON.parse(localStorage.getItem(LS_OUTBOX) || '[]'); } catch (e) { return []; }\n}\nfunction writeOutbox(list) {\n  try { localStorage.setItem(LS_OUTBOX, JSON.stringify(list)); } catch (e) {}\n}\n\n// One person, one folder — even when they type their name in Thai one day and\n// English the next. Each row lists every spelling that is the SAME person; the\n// FIRST entry is the display name their folder is filed under.\n// To add someone, add a row. Nothing else needs changing.\n//\n// Sukhumvit 39 physio roster. Nicknames only — the site never asks for full names.\nconst NAME_ALIASES = [\n  ['Aris', 'อริส'],\n  ['Kun', 'กุ่น'],\n  ['Bua', 'บัว'],\n  ['Jetam', 'เฌอแตม'],\n  ['Tee', 'ตี้'],\n  ['Gear', 'เกียร์'],\n  ['Oil', 'ออย'],\n  ['Boom', 'บูม'],\n  ['Nut', 'นัท'],\n  ['Beam', 'บีม'],\n  ['Pleng', 'เพลง'],\n  ['Ford', 'ฟอร์ด'],\n  ['Cream', 'ครีม'],\n  ['Gift', 'กิ๊ฟ'],\n  ['Phing', 'ผิง'],\n  ['Jimmy', 'จิมมี่'],\n  ['Tul', 'ตุล'],\n  ['Sai', 'ทราย'],\n  ['Fah', 'ฟ้า'],\n  ['Kat', 'แคท'],\n  ['Moothong', 'หมูทอง'],\n  ['Blue', 'บลู'],\n  ['Opal', 'โอปอล'],\n  ['Can', 'แคน'],\n  ['Bump', 'บั๊ม'],\n  ['Mighty', 'ไมตี้'],\n  ['Earth', 'เอิร์ท'],\n  ['Ninew', 'นินิว'],\n  ['Gale', 'เกล'],\n  ['Thun', 'ธัน'],\n  ['Kwang', 'กวาง'],\n  ['Gam', 'แก้ม'],\n  ['Pik', 'ปิ๊ก'],\n  ['Best', 'เบส'],\n  ['Pim', 'ภิม'],\n  ['Tong', 'ตง'],\n  ['Gomen', 'โกเมน'],\n  ['Oat', 'โอ็ต', 'โอ๊ต'],\n\n  // Seniors — the P' prefix is optional when typing.\n  [\"P'Big\", 'บิ๊ก', 'Big'],\n\n  // TWO PEOPLE SHARE ONE THAI SPELLING: พลอย\n  // Janisata (P'Ploy) and Waranya (PloyR) both write พลอย, so bare พลอย cannot\n  // be assigned to either without risking merging two people's work. Each is\n  // listed under their distinguishing spelling instead; ask these two to type\n  // the English form. Bare พลอย lands in its own folder as a visible signal.\n  [\"P'Ploy\", \"p'พลอย\", 'PloyJ'],\n  ['PloyR', 'พลอยR', 'PloyW']\n];\n\nconst ALIAS_MAP = (() => {\n  const m = {};\n  NAME_ALIASES.forEach(row => {\n    const canon = String(row[0] || '').trim();\n    row.forEach(v => {\n      const k = String(v || '').trim().toLowerCase().replace(/\\s+/g, ' ');\n      if (k) m[k] = canon;\n    });\n  });\n  return m;\n})();\n\nconst normName = (n) => String(n || '').trim().toLowerCase().replace(/\\s+/g, ' ');\n\n// Resolve any spelling to the one canonical name, so grouping and returning\n// users both land in the same folder.\nconst canonName = (n) => ALIAS_MAP[normName(n)] || String(n || '').trim();\n\nconst folderKey = (n) => normName(canonName(n));\n\nfunction knownNames() {\n  try { return JSON.parse(localStorage.getItem(LS_NAMES) || '[]'); } catch (e) { return []; }\n}\nfunction rememberName(n) {\n  const name = String(n || '').trim();\n  if (!name) return knownNames();\n  const list = knownNames().filter(x => folderKey(x) !== folderKey(name));\n  list.unshift(name);\n  const out = list.slice(0, 12);\n  try { localStorage.setItem(LS_NAMES, JSON.stringify(out)); } catch (e) {}\n  return out;\n}\n\nconst UI = {\n  en: {\n    kicker: '45 cases · the call before the patient arrives · written from real charts',\n    startTitle: 'The call before the patient arrives.',\n    startBody: 'You get four cases, one at a time, rising from difficulty 1 to difficulty 5. Each one is a real kind of chart — some almost empty, some half filled in, some written at length. You answer using only what the chart gives you. Then the call is revealed and your answers lock.',\n    startNote: 'Your answers go to the clinic and a senior physiotherapist reads them and replies. After the reveal you also see what the call should have found — so you can mark yourself before anyone else does.',\n    caseInfo: 'Case information',\n    nextStep: 'Next step',\n    revealWarn: 'The next step reveals the call. Once you go on you cannot change steps 1 to 3.',\n    onTheCall: 'What the call gave you',\n    shouldHave: 'What you should have asked',\n    yourName: 'Your name', namePh: 'e.g. Tee', begin: 'Start my four cases',\n    caseInfoPad: '',\n    needName: 'Add your name to begin.', ready: 'Four cases, picked fresh for you.',\n    longPh: 'Write your answer in your own words',\n    captionPh: 'Why this image, what you point at, and what it changes about this session',\n    pasteHelp: 'Upload the image you would have ready when he or she walks in. Up to 4 images.',\n    addImage: 'Add another image', tooManyImages: 'Up to 4 images per answer.',\n    uploadBtn: 'Upload an image', orPaste: 'or drag an image in, or click this box and paste (⌘V / Ctrl+V)',\n    dropHere: 'Drop the image to use it', dropNotImage: 'That file is not an image.',\n    urlLabel: 'Image address', useUrl: 'Use this address', removeImage: 'Remove image',\n    dictate: 'Dictate', stopDictate: 'Stop dictation', listening: 'Listening — speak now.',\n    dictateHint: 'Speak instead of typing.', noDictation: 'Dictation is not available in this browser.',\n    record: 'Record your answer', stopRecord: 'Stop recording',\n    recordHint: 'Or say your answer out loud — the senior physiotherapist listens to the recording.',\n    recordingNow: 'Recording — speak now.', noRecord: 'Recording is not available in this browser.',\n    removeAudio: 'Delete this recording',\n    micDenied: 'The microphone was blocked. Allow microphone access for this site, then try again.',\n    badUrl: 'That does not look like an image address — it should start with http.',\n    urlFailed: 'That address would not load as an image. Save the picture to your device and upload it instead.',\n    received: 'Received', setComplete: 'Set complete',\n    doneTitle: 'That is all four — thank you.',\n    moreCases: 'Answer more cases', finish: 'Finish for now',\n    submit: 'Submit answers', sending: 'Sending…',\n    submitReady: 'Your answers go straight to the clinic.',\n    nextCase: 'Next case', caseOf: 'Case', of: 'of',\n    saveExit: 'Save and come back later',\n    resume: 'Carry on where I left off', startFresh: 'Start a new set'\n  },\n  th: {\n    kicker: '45 เคส · การโทรก่อนคนไข้มาถึง · เขียนจากชาร์ตจริง',\n    startTitle: 'การโทรก่อนคนไข้มาถึง',\n    startBody: 'คุณจะได้ 4 เคส ทีละเคส ความยากไต่จากระดับ 1 ถึงระดับ 5 แต่ละเคสคือชาร์ตแบบที่เจอจริง บางเคสแทบไม่มีข้อมูล บางเคสกรอกมาครึ่งเดียว บางเคสคนไข้เขียนมายาว คุณตอบจากข้อมูลในชาร์ตเท่านั้น แล้วระบบจะเปิดเผยสิ่งที่ได้จากการโทร และคำตอบของคุณจะถูกล็อก',\n    startNote: 'คำตอบของคุณจะถูกส่งให้คลินิก และนักกายภาพบำบัดอาวุโสจะอ่านแล้วตอบกลับ หลังเปิดเผยการโทร คุณจะได้เห็นด้วยว่าการโทรควรได้ข้อมูลอะไร เพื่อให้คุณตรวจตัวเองได้ก่อนที่คนอื่นจะตรวจ',\n    caseInfo: 'ข้อมูลเคส',\n    nextStep: 'ขั้นตอนต่อไป',\n    revealWarn: 'ขั้นตอนต่อไปจะเปิดเผยสิ่งที่ได้จากการโทร เมื่อไปต่อแล้วจะแก้ข้อ 1 ถึง 3 ไม่ได้',\n    onTheCall: 'สิ่งที่ได้จากการโทร',\n    shouldHave: 'สิ่งที่ควรถาม',\n    yourName: 'ชื่อของคุณ', namePh: 'เช่น ตี๋', begin: 'เริ่ม 4 เคสของฉัน',\n    needName: 'กรุณาใส่ชื่อก่อนเริ่ม', ready: 'สี่เคส สุ่มใหม่สำหรับคุณ',\n    longPh: 'เขียนคำตอบด้วยคำพูดของคุณเอง',\n    captionPh: 'ทำไมต้องเป็นรูปนี้ จะชี้ที่จุดไหน และรูปนี้เปลี่ยนอะไรในการรักษาครั้งนี้',\n    pasteHelp: 'อัปโหลดรูปที่คุณเตรียมไว้สำหรั st isMediaKey = k => /:(img\\d*|audio)$/.test(k);\nfunction imgList(answers, qid) {\n  const out = [];\n  for (let n = 0; n < 12; n++) { const v = (answers || {})[imgKey(qid, n)]; if (v) out.push(v); }\n  return out;\n}\nfunction withImages(answers, qid, list) {\n  const a = Object.assign({}, answers);\n  for (let n = 0; n < 12; n++) delete a[imgKey(qid, n)];\n  list.forEach((u, n) => { a[imgKey(qid, n)] = u; });\n  return a;\n}\n\nconst BUCKETS = [[1, 2], [3], [4], [5]];\n\nconst MK = {\n  en: {\n    tag: 'Marking view', leave: 'Leave', allPeople: '← All people',\n    expCsv: 'Export marks (.csv)', expAll: 'Export everything (.json)',\n    weakest: 'Where the team is weakest', everyone: 'Everyone who has answered',\n    byPerson: 'Scores by person — weakest first', noMarksYet: 'nothing marked yet',\n    scoreOf: (n, m) => n + ' of ' + m + ' pre-arrival choices right',\n    markedOf: (k, avg) => k + ' marked, average ' + avg + '/5',\n    mediaErr: 'Could not load — collapse and reopen to try again',\n    keepIt: 'Keep it', scoreLabel: 'Score /5', commentLabel: 'Your comment to them',\n    commentPh: 'What was strong, what was missing against BPC procedure',\n    gateTitle: 'Marking view', gateBody: 'Enter the clinic passcode to read and mark submitted answers.',\n    passcode: 'Passcode', passcodePh: 'Clinic passcode', back: 'Back', clinicStaff: 'Clinic staff',\n    submitted: 'Submitted answers', person: 'person', people: 'people',\n    answer1: 'answer', answerN: 'answers', toMark: 'still to mark', nothingYet: 'Nothing submitted yet.',\n    case1: '1 case', caseN: 'different cases', lastSeen: 'last', allMarked: 'All marked',\n    statPerson: 'Person', statPeople: 'People', statIn: 'Answers in', statToMark: 'Still to mark', statCases: 'Cases covered',\n    wrongOf: (w, n) => w + ' of ' + n + ' picked the wrong pre-arrival action',\n    signedAs: (n) => 'Signed in as “' + n + '”', inThai: ' · answered in Thai',\n    marked: 'Marked', unmarked: 'Unmarked', mcShort: ' e by id below keeps a double evaluation harmless.\n    document.addEventListener('paste', this.onDocPaste);\n    let taker = '', key = '', done = [], lang = '', sess = null;\n    try {\n      taker = localStorage.getItem(LS_TAKER) || '';\n      key = localStorage.getItem(LS_ADMIN) || '';\n      lang = localStorage.getItem(LS_LANG) || '';\n      done = JSON.parse(localStorage.getItem(LS_DONE) || '[]');\n      sess = JSON.parse(localStorage.getItem(LS_SESSION) || 'null');\n    } catch (e) {}\n    const patch = { names: knownNames() };\n    if (sess && sess.queue && sess.queue.length && sess.qi < sess.queue.length) patch.session = sess;\n    if (taker) patch.taker = taker;\n    if (lang === 'th' || lang === 'en') patch.lang = lang;\n    if (done.length) patch.done = done;\n    if (Object.keys(patch).length) this.setState(patch);\n    let marker = '';\n    try { marker = localStorage.getItem(LS_MARKER) || ''; } catch (e) {}\n    if (marker) this.setState({ markerName: marker });\n    // A remembered passcode opens the marking view directly, but only once we\n    // know who is marking; otherwise ask at the door first.\n    if (key && marker) this.setState({ adminKey: key, view: 'marker' },\n      () => { const after = () => this.grabRoster(); this.load(key).then(after, after); });\n    else if (key) this.setState({ view: 'gate', gateKey: key }, () => this.grabRoster());\n\n    try { document.title = 'BPC Patient Journey Trainer'; } catch (e) {}\n\n    try {\n      const cm = JSON.parse(localStorage.getItem(LS_MARKERS) || '[]');\n      if (cm.length) this.setState({ markers: cm });\n    } catch (e) {}\n    let cachedRoster = [];\n    try {\n      cachedRoster = JSON.parse(localStorage.getItem(LS_ROSTER) || '[]');\n      if (cachedRoster.length) this.setState({ roster: cachedRoster });\n    } catch (e) {}\n    // The name list is only needed by the first screen, and a cached copy\n    // already draws it. Refreshing it the instant the page opens put an\n    // eleven-second call in front of the passcode of whoever was heading for\n    // the marking view. If we have a copy, the refresh can wait.\n    if (!key) {\n      if (cachedRoster.length) setTimeout(() => this.grabRoster(), 30000);\n      else this.grabRoster();\n    }\n\n    this.setState({ pending: readOutbox().length });\n    this.drainTimer = setTimeout(() => this.drainOutbox(), 3000);\n    this.drainEvery = setInterval(() => this.drainOutbox(), 60000);\n    this.onOnline = () => this.drainOutbox();\n    window.addEventListener('online', this.onOnline);\n  }\n\n  // The first call after a quiet spell takes eight seconds or more while\n  // Google starts the script. Typing a passcode takes about as long, so the\n  // gate fires a light roster call on open (and the start screen does the\n  // same once a name is picked or typed), so the passcode check or progress\n  // lookup that follows lands on a script that is already awake.\n  warmClinic() {\n    const now = Date.now();\n    if (now - (this.warmedAt || 0) < 240000) return;\n    this.warmedAt = now;\n    this.grabRoster();\n  }\n\n  qs_(ep, q) { return ep + (ep.indexOf('?') > -1 ? '&' : '?') + q; }\n\n  async grabRoster() {\n    const ep = this.endpoint();\n    if (!ep) return;\n    try {\n      const res = await this.clinicFetch(this.qs_(ep, 'roster=1'), 45000);\n      const d = await res.json();\n      if (d && d.ok && Array.isArray(d.people) && d.people.length) {\n        this.setState({ roster: d.people });\n        try { localStorage.setItem(LS_ROSTER, JSON.stringify(d.people)); } catch (e) {}\n      }\n      if (d && d.ok && Array.isArray(d.markers)) this.setMarkers(d.markers);\n    } catch (e) {}\n  }\n\n  setMarkers(list) {\n    this.setState({ markers: list });\n    try { localStorage.setItem(LS_MARKERS, JSON.stringify(list)); } catch (e) {}\n  }\n\n  // On the Markers tab, under any spelling the roster knows. Until the list\n  // has arrived (or if the tab is empty) nobody is turned away; the clinic\n  // script nRecord() {\n    return !!(typeof navigator !== 'undefined' && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);\n  }\n\n  stopRecording() {\n    if (this.tick) { clearInterval(this.tick); this.tick = null; }\n    if (this.mr) { try { this.mr.stop(); } catch (e) {} }\n  }\n\n  toggleRecording = async (qid) => {\n    if (this.state.recording === qid) { this.stopRecording(); return; }\n    if (this.state.recording) this.stopRecording();\n    if (!this.canRecord()) return;\n    const t = UI[this.state.lang];\n    try {\n      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });\n      let mr;\n      const opts = { audioBitsPerSecond: 32000 };\n      try { mr = new MediaRecorder(stream, Object.assign({ mimeType: 'audio/webm' }, opts)); }\n      catch (e) { mr = new MediaRecorder(stream, opts); }\n      const chunks = [];\n      mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };\n      mr.onstop = () => {\n        stream.getTracks().forEach(tr => tr.stop());\n        if (this.tick) { clearInterval(this.tick); this.tick = null; }\n        const secs = Math.max(1, Math.round((Date.now() - (this.recStart || Date.now())) / 1000));\n        this.mr = null;\n        const blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });\n        const fr = new FileReader();\n        fr.onload = () => this.setState(s => ({\n          recording: null, recSec: 0,\n          answers: Object.assign({}, s.answers, { [qid + ':audio']: fr.result, [qid + ':audiosec']: secs })\n        }), () => this.saveSession());\n        fr.onerror = () => this.setState({ recording: null, recSec: 0 });\n        fr.readAsDataURL(blob);\n      };\n      this.mr = mr;\n      this.recStart = Date.now();\n      mr.start();\n      this.tick = setInterval(() => {\n        const s = Math.round((Date.now() - this.recStart) / 1000);\n        this.setState({ recSec: s });\n        if (s >= 240) this.stopRecording();\n      },
